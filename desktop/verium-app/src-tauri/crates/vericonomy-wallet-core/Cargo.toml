[package]
name = "vericonomy-wallet-core"
version = "1.0.0"
description = "Portable, Tauri-free wallet core: BIP39 mnemonics, BIP32 derivation, and chain-agnostic WIF encoding shared by desktop and future mobile shells."
authors = ["Vericonomy developers"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vericonomy_wallet_core"

[dependencies]
bip39 = "2"
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
bs58 = { version = "0.5", features = ["check"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
