[workspace]
members = ["crates/vericonomy-desktop-host"]

[package]
name = "verium-qt"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Vericonomy desktop wallet — native Qt 6 / QML frontend over the shared Rust core."
authors = ["Vericonomy developers"]
license = "MIT"

# Cargo-driven cxx-qt build: the binary embeds QGuiApplication + QQmlApplicationEngine
# from cxx-qt-lib, so there is no hand-written C++ and no WebView. CMake + Corrosion
# packaging is layered on in Phase 5 for installer/deploy tooling.
[[bin]]
name = "verium-qt"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
vericonomy-desktop-host = { path = "crates/vericonomy-desktop-host" }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.7"
